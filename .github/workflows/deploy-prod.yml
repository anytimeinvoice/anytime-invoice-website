name: Deploy Prod

# Production deploy for the marketing site — from `master` or a semver
# release tag reachable from master, always HUMAN-dispatched (mirrors the
# app repo's ADR-0006 human-gate). Agents may prepare the dev -> master
# release PR but must never dispatch this workflow. No DB, no workers, no
# separate promote-from-preview step: this is a static site with no build
# step, so a fresh `vercel deploy --prod` rebuild is cheap and
# side-effect-free — unlike the app repo, there's no reason to promote an
# already-built preview instead of just rebuilding.
#
# `vercel deploy --prod` aliases to whichever domains are configured as this
# project's Production target (www.anytimeinvoice.com/.com.au and the apex
# domains) — none are pinned to a git branch, so no explicit `vercel alias`
# step is needed here.

on:
  workflow_dispatch: {}

jobs:
  guard:
    name: Guard — must dispatch from master or a release tag on master
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed to verify tag ancestry against origin/master
          fetch-depth: 0

      - name: Verify ref is master or a semver tag on master
        env:
          REF: ${{ github.ref }}
        run: |
          if echo "$REF" | grep -qE '^refs/heads/master$'; then
            echo "Guard passed: dispatched from master"
          elif echo "$REF" | grep -qE '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+'; then
            git fetch origin master --quiet
            TAG_COMMIT=$(git rev-parse 'HEAD^{commit}')
            if git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
              echo "Guard passed: tag $REF ($TAG_COMMIT) is on master"
            else
              echo "::error::Guard failed: tag '$REF' points to commit $TAG_COMMIT, which is NOT reachable from origin/master. Release tags must be cut on master."
              exit 1
            fi
          else
            echo "::error::Production deploys must be dispatched from master or a semver tag (vX.Y.Z) on master (got '$REF'). Merge dev -> master first, then re-run this workflow with master (or a tag on master) selected."
            exit 1
          fi

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 10
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uR3MOby3IAOOdmZCWSaP0eFg
        run: |
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --project anytime-invoice-website

      - name: Verify production is live
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://www.anytimeinvoice.com/)
            if [ "$CODE" = "200" ]; then
              echo "www.anytimeinvoice.com is live (200)"
              exit 0
            fi
            echo "Got HTTP $CODE — retry $i/12 in 10s…"
            sleep 10
          done
          echo "::error::www.anytimeinvoice.com did not return 200 within the timeout."
          exit 1
